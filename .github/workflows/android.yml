name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so version derivation sees all tags/commits

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Run unit tests
        run: ./gradlew test

      - name: Derive version from conventional commits
        id: semver
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: v
          default_bump: false # non-conventional commits -> no tag -> fallback below

      - name: Resolve version name
        id: version
        run: |
          if [ -n "${{ steps.semver.outputs.new_version }}" ]; then
            echo "name=${{ steps.semver.outputs.new_version }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ steps.semver.outputs.new_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "tag=v0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 -d --ignore-garbage > keystore.jks

      # Verify the keystore opens and read the key alias directly from it —
      # the single-key keystore is the source of truth, so a mistyped KEY_ALIAS
      # secret can't break signing.
      - name: Verify keystore and resolve key alias
        if: env.KEYSTORE_B64 != ''
        id: keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          pass=$(printf %s "$KEYSTORE_PASSWORD" | tr -d '[:space:]')
          keytool -list -keystore keystore.jks -storepass "$pass" > /tmp/aliases.txt \
            || { echo "::error::KEYSTORE_PASSWORD does not open the keystore"; exit 1; }
          alias=$(grep -i "PrivateKeyEntry" /tmp/aliases.txt | head -1 | cut -d',' -f1 | tr -d '[:space:]')
          [ -n "$alias" ] || { echo "::error::no PrivateKeyEntry found in keystore"; exit 1; }
          echo "alias=$alias" >> "$GITHUB_OUTPUT"
          echo "Using key alias: $alias"

      - name: Assemble release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ steps.keystore.outputs.alias || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease
          -PversionCode=${{ github.run_number }}
          -PversionName=${{ steps.version.outputs.name }}

      # Stable "fingerly-vX.Y.Z.apk" naming — Obtainium and humans both prefer it
      # over the default app-release.apk.
      - name: Name APK
        run: mv app/build/outputs/apk/release/*.apk fingerly-v${{ steps.version.outputs.name }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fingerly-${{ steps.version.outputs.name }}
          path: fingerly-v*.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Fingerly ${{ steps.version.outputs.name }}
          generate_release_notes: true # commits since last release as changelog
          files: fingerly-v*.apk
